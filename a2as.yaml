files:
  .docx:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      delete: "False"
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", "..", .env]
  .well-known:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), .well-known]
  /app/template/templateResumeDocV2.docx:
    type: literal
    actions: [read]
    params:
      caller: [create_formatted_resume]
  agent.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [well_known_path, agent.json]
  agent_json_path:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.exists, open, json.load]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  module_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  SERVICE_ACCOUNT_KEY_PATH:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  temp_file_path:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [pdf_file]
  well_known_path:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]

processes:
  npx:
    type: mcp
    actions: [exec]
    args: [[-y, '@gannonh/firebase-mcp']]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]

networks:
