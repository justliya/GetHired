    type: api
    actions: [connect]
    urls: [/jobsearch-mcp/]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [McpToolset]
      links: [MCPToolset]
  storage.googleapis.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      caller: [upload_to_firebase_storage]
