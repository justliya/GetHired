apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gethired-scheduler
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/gethired-scheduler
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: CLOUD_TASKS_LOCATION
          value: "us-central1"
        - name: CLOUD_TASKS_QUEUE
          value: "scheduled-searches"
        - name: PORT
          value: "8000"
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
  traffic:
  - percent: 100
    latestRevision: true
