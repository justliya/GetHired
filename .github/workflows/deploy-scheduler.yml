name: Deploy Cloud Tasks Scheduler

on:
  push:
    branches: [main]
    paths: ['cloud_tasks/**']
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
        export_environment_variables: true
        cleanup_credentials: true

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCR
      run: |
        gcloud auth configure-docker gcr.io --quiet
        echo "Docker configured for GCR"

    - name: Enable required APIs
      run: |
        gcloud services enable \
          cloudtasks.googleapis.com \
          run.googleapis.com \
          artifactregistry.googleapis.com \
          --project=$GOOGLE_CLOUD_PROJECT

    - name: Deploy Cloud Tasks Scheduler
      working-directory: cloud_tasks
      env:
        SERVICE_NAME: gethired-scheduler
        REGION: us-central1
        QUEUE_NAME: scheduled-searches
      run: |
        ./deploy.sh $GOOGLE_CLOUD_PROJECT

    - name: Verify deployment
      env:
        SERVICE_NAME: gethired-scheduler
        REGION: us-central1
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
          --region=$REGION \
          --project=$GOOGLE_CLOUD_PROJECT \
          --format="value(status.url)")
        echo "✅ Scheduler deployed at: $SERVICE_URL"
        echo "🔗 Health check: $SERVICE_URL/api/v1/health"
