name: Deploy Cloud Tasks Scheduler

on:
  push:
    branches: [main]
    paths: ['cloud_tasks/**']
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy Cloud Tasks Scheduler
        working-directory: cloud_tasks
        env:
          SERVICE_NAME: gethired-scheduler
          REGION: us-central1
          QUEUE_NAME: scheduled-searches
        run: |
          IMAGE_NAME="gcr.io/$GOOGLE_CLOUD_PROJECT/$SERVICE_NAME"
          IMAGE_TAG="${{ github.sha }}"
          
          # Build Docker image
          echo "🐳 Building Docker image..."
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest
          
          # Configure docker and push
          echo "📤 Pushing to Container Registry..."
          gcloud auth configure-docker gcr.io -q
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:latest
          
          # Deploy to Cloud Run
          echo "☁️ Deploying to Cloud Run..."
          gcloud run deploy $SERVICE_NAME \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=$REGION \
            --image=${IMAGE_NAME}:${IMAGE_TAG} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --max-instances=10 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT,CLOUD_TASKS_LOCATION=$REGION,CLOUD_TASKS_QUEUE=$QUEUE_NAME,GETHIRED_API_URL=${{ secrets.GETHIRED_API_URL }},MAILCHIMP_API_KEY=${{ secrets.MAILCHIMP_API_KEY }},MAILCHIMP_SERVER_PREFIX=${{ secrets.MAILCHIMP_SERVER_PREFIX }},MAILCHIMP_LIST_ID=${{ secrets.MAILCHIMP_LIST_ID }},MAILCHIMP_FROM_EMAIL=${{ secrets.MAILCHIMP_FROM_EMAIL }},MAILCHIMP_FROM_NAME=${{ secrets.MAILCHIMP_FROM_NAME }}"
          
          # Verify deployment
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --project=$GOOGLE_CLOUD_PROJECT \
            --format="value(status.url)")
          echo "✅ Scheduler deployed at: $SERVICE_URL"
          echo "🔗 Health check: $SERVICE_URL/api/v1/health"
