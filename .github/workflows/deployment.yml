name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - agent-interaction
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Fix sub-agent imports
        working-directory: jobsearch_agents
        run: |
          cat > fix_imports.py << 'EOF'
          import os
          import re
          
          # Read the main agent.py to see what import pattern is used
          with open('jobsearch_agents/agent.py', 'r') as f:
              main_agent_content = f.read()
          
          # Find the import pattern used in main agent
          if 'from google.adk.tools.mcp_tool.mcp_toolset import MCPToolset, StdioServerParameters' in main_agent_content:
              # StdioServerParameters is imported from mcp_toolset
              correct_import = 'from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPServerParams'
          else:
              # Try the session_manager import
              correct_import = 'from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPServerParams'
          
          # Fix all Python files in sub_agents
          for root, dirs, files in os.walk('jobsearch_agents/sub_agents'):
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                      
                      # Replace any import of StreamableHTTPServerParams
                      content = re.sub(
                          r'from google\.adk\.tools\.mcp_tool\.\w+ import .*StreamableHTTPServerParams.*',
                          correct_import,
                          content
                      )
                      
                      with open(filepath, 'w') as f:
                          f.write(content)
                      print(f'Fixed imports in {filepath}')
          EOF
          
          poetry run python fix_imports.py

      - name: Create .env files
        working-directory: jobsearch_agents
        run: |
          # Create .env in the inner jobsearch_agents directory
          cat > jobsearch_agents/.env << EOF
          SERVICE_ACCOUNT_KEY_PATH=serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }}
          EOF
          
          # Also create one at the root level
          cat > .env << EOF
          SERVICE_ACCOUNT_KEY_PATH=jobsearch_agents/serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }}
          EOF

      - name: Fix __init__.py and ensure root_agent export
        working-directory: jobsearch_agents
        run: |
          # Create proper __init__.py
          cat > jobsearch_agents/__init__.py << 'EOF'
          """
          Job Search Automation Agent package.
          """
          from . import agent
          from .agent import root_agent
          
          __all__ = ['agent', 'root_agent']
          EOF
          
          # Ensure agent.py exports root_agent at the end
          echo "Checking if agent.py exports root_agent..."
          if ! grep -q "^root_agent" jobsearch_agents/agent.py; then
              echo "Adding root_agent export to agent.py..."
              echo -e "\n# Export root_agent for ADK\nroot_agent = agent" >> jobsearch_agents/agent.py
          fi

      - name: Create deployment package
        working-directory: jobsearch_agents
        run: |
          # Export requirements from poetry
          poetry export -f requirements.txt --output requirements.txt --without-hashes
          
          # Create custom Dockerfile
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          
          WORKDIR /app
          
          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              git \
              build-essential \
              && rm -rf /var/lib/apt/lists/*
          
          # Upgrade pip
          RUN pip install --upgrade pip
          
          # Copy requirements first for better caching
          COPY requirements.txt /app/
          RUN pip install -r requirements.txt
          
          # Install ADK with correct git+ prefix
          RUN pip install git+https://github.com/google/adk-python.git
          
          # Copy the agent code
          COPY . /app/agents/
          
          # Create the expected directory structure
          RUN mkdir -p /app/agents/jobsearch_agents
          
          # Set up the environment
          ENV PYTHONPATH=/app/agents:/app/agents/jobsearch_agents:$PYTHONPATH
          ENV PORT=8080
          ENV APP_NAME=jobsearch_agents
          
          # Change to the directory where the agent code lives
          WORKDIR /app/agents/jobsearch_agents
          
          # Create a startup script that ensures we're in the right directory
          RUN echo '#!/bin/bash\n\
          cd /app/agents/jobsearch_agents\n\
          echo "Current directory: $(pwd)"\n\
          echo "Files in current directory:"\n\
          ls -la\n\
          echo "Python path: $PYTHONPATH"\n\
          python -m google.adk.server.deployed_agent_server' > /app/start.sh && \
          chmod +x /app/start.sh
          
          # Run the ADK server
          CMD ["/app/start.sh"]
          EOF
          
          # Create .gcloudignore to exclude unnecessary files
          cat > .gcloudignore << 'EOF'
          .gcloudignore
          .git
          .gitignore
          .venv/
          __pycache__/
          *.pyc
          *.pyo
          *.pyd
          .Python
          *.so
          .coverage
          .pytest_cache
          .mypy_cache
          .tox
          .nox
          poetry.lock
          pyproject.toml
          EOF
          
          echo "Deployment package created"

      - name: Deploy to Cloud Run
        working-directory: jobsearch_agents
        env:
          SERVICE_NAME: gethired-agents
        run: |
          # Deploy using gcloud run deploy with our custom Dockerfile
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }},GOOGLE_GENAI_USE_VERTEXAI=True,GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }},APP_NAME=jobsearch_agents" \
            --memory=2Gi \
            --timeout=3600 \
            --max-instances=10

      - name: Display service URL
        env:
          SERVICE_NAME: gethired-agents
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --format='value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "You can test the agent at: $SERVICE_URL/ui"