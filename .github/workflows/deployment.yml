name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - agent-interaction
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      
      - name: Create .env files
        working-directory: jobsearch_agents
        run: |
          # Create .env in the inner jobsearch_agents directory
          cat > jobsearch_agents/.env << EOF
          SERVICE_ACCOUNT_KEY_PATH=serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }}
          EOF
          
          # Also create one at the root level
          cat > .env << EOF
          SERVICE_ACCOUNT_KEY_PATH=jobsearch_agents/serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }}
          EOF

      - name: Fix __init__.py and ensure root_agent export
        working-directory: jobsearch_agents
        run: |
          # Create proper __init__.py
          cat > jobsearch_agents/__init__.py << 'EOF'
          """
          Job Search Automation Agent package.
          """
          from . import agent
          from .agent import root_agent
          
          __all__ = ['agent', 'root_agent']
          EOF
          
          # Ensure agent.py exports root_agent at the end
          echo "Checking if agent.py exports root_agent..."
          if ! grep -q "^root_agent" jobsearch_agents/agent.py; then
              echo "Adding root_agent export to agent.py..."
              echo -e "\n# Export root_agent for ADK\nroot_agent = agent" >> jobsearch_agents/agent.py
          fi

      - name: Create deployment package
        working-directory: jobsearch_agents
        run: |
          # Export requirements from poetry
          poetry export -f requirements.txt --output requirements.txt --without-hashes
          
          # Create custom Dockerfile that matches ADK expectations
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          
          # Install system dependencies
          RUN apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*
          
          # Set working directory
          WORKDIR /app
          
          # Copy requirements and install dependencies
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          
          # Install ADK
          RUN pip install --no-cache-dir git+https://github.com/google/adk-python.git
          
          # Copy the entire jobsearch_agents directory to /app/agents/
          COPY . /app/agents/
          
          # Set environment variables
          ENV PORT=8000
          ENV PYTHONPATH=/app/agents:$PYTHONPATH
          ENV APP_NAME=jobsearch_agents
          
          # The ADK server expects to find the agent module in a specific way
          WORKDIR /app/agents
          
          # Expose port 8000
          EXPOSE 8000
          
          # Run the ADK server
          CMD ["python", "-m", "google.adk.server.deployed_agent_server"]
          EOF
          
          # Create .gcloudignore
          cat > .gcloudignore << 'EOF'
          .gcloudignore
          .git
          .gitignore
          .venv/
          __pycache__/
          *.pyc
          *.pyo
          *.pyd
          .Python
          *.so
          .coverage
          .pytest_cache
          .mypy_cache
          poetry.lock
          pyproject.toml
          EOF
          
          echo "Deployment package created"

      - name: Test local build
        working-directory: jobsearch_agents
        run: |
          # Test if we can build the Docker image locally
          docker build -t test-agent . || {
            echo "Docker build failed. Checking structure..."
            ls -la
            echo "--- Checking jobsearch_agents directory ---"
            ls -la jobsearch_agents/
            exit 1
          }
          
          echo "Docker build successful"

      - name: Deploy to Cloud Run
        working-directory: jobsearch_agents
        env:
          SERVICE_NAME: gethired-agents
        run: |
          # Deploy using gcloud run deploy
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --set-env-vars="FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }},GOOGLE_GENAI_USE_VERTEXAI=True,GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }},APP_NAME=jobsearch_agents,PORT=8000" \
            --memory=2Gi \
            --max-instances=10

      - name: Add IAM policy binding
        env:
          SERVICE_NAME: gethired-agents
        run: |
          # Add the IAM policy binding as suggested in the error
          gcloud beta run services add-iam-policy-binding $SERVICE_NAME \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Display service URL and logs
        env:
          SERVICE_NAME: gethired-agents
        run: |
          # Get service URL
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          
          # Get recent logs to debug any issues
          echo "Recent logs:"
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE_NAME" \
            --limit=50 \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --format="table(timestamp, textPayload)" || echo "Could not fetch logs"