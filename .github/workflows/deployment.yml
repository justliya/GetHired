name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root
          ADK_PATH=$(poetry run which adk)
          if [ -z "$ADK_PATH" ]; then
            echo "Error: ADK command not found in PATH"
            exit 1
          fi
          echo "ADK_CMD=$ADK_PATH" >> $GITHUB_ENV

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Check jobsearch_agents/__init__.py
        working-directory: jobsearch_agents
        run: |
          echo "Checking if jobsearch_agents/__init__.py exists and has correct import:"
          if [ -f "jobsearch_agents/__init__.py" ]; then
            cat jobsearch_agents/__init__.py
          else
            echo "Creating jobsearch_agents/__init__.py with correct import"
            echo "from . import agent" > jobsearch_agents/__init__.py
          fi

      - name: Deploy to Cloud Run
        working-directory: jobsearch_agents
        env:
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SERVICE_ACCOUNT_KEY_PATH: jobsearch_agents/serviceAccountKey.json
          GOOGLE_GENAI_USE_VERTEXAI: 'True'
          AGENT_PATH: ./jobsearch_agents
          SERVICE_NAME: gethired-agents
          APP_NAME: jobsearch_agents
        run: |
          echo "Current directory: $(pwd)"
          echo "AGENT_PATH: $AGENT_PATH"
          echo "Contents of current directory:"
          ls -la
          echo "Contents of agent directory:"
          ls -la $AGENT_PATH/
          
          poetry run adk deploy cloud_run \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --service_name=$SERVICE_NAME \
            --app_name=$APP_NAME \
            --with_ui \
            $AGENT_PATH