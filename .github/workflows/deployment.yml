name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Create .env file for agent
        working-directory: jobsearch_agents
        run: |
          cat > .env << EOF
          SERVICE_ACCOUNT_KEY_PATH=jobsearch_agents/serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          EOF
          
          echo "Created .env file"

      - name: Fix __init__.py and test import
        working-directory: jobsearch_agents
        run: |
          cat > jobsearch_agents/__init__.py << 'EOF'
          """
          Job Search Automation Agent package.
          """
          from . import agent
          from .agent import root_agent
          
          __all__ = ['agent', 'root_agent']
          EOF
          
          echo "Testing if module can be imported..."
          poetry run python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          try:
              import jobsearch_agents
              print('Successfully imported jobsearch_agents')
              print('Available attributes:', dir(jobsearch_agents))
              print('Has root_agent?', hasattr(jobsearch_agents, 'root_agent'))
              if hasattr(jobsearch_agents, 'root_agent'):
                  print('root_agent type:', type(jobsearch_agents.root_agent))
          except Exception as e:
              print(f'Failed to import: {e}')
              import traceback
              traceback.print_exc()
          "

      - name: Deploy to Cloud Run  
        working-directory: jobsearch_agents
        env:
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SERVICE_ACCOUNT_KEY_PATH: jobsearch_agents/serviceAccountKey.json
          GOOGLE_GENAI_USE_VERTEXAI: 'True'
          AGENT_PATH: ./jobsearch_agents
          SERVICE_NAME: gethired-agents
          APP_NAME: jobsearch_agents
        run: |
          echo "Current directory: $(pwd)"
          echo "AGENT_PATH: $AGENT_PATH"
          
          echo "y" | poetry run adk deploy cloud_run \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --service_name=$SERVICE_NAME \
            --app_name=$APP_NAME \
            --with_ui \
            $AGENT_PATH