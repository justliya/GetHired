name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Fix __init__.py to expose root_agent
        run: |
          echo "Updating __init__.py to expose root_agent..."
          cat > jobsearch_agents/jobsearch_agents/__init__.py << 'EOF'
          """
          Job Search Automation Agent package.
          """
          from . import agent
          from .agent import root_agent
          
          __all__ = ['agent', 'root_agent']
          EOF
          
          echo "Updated __init__.py content:"
          cat jobsearch_agents/jobsearch_agents/__init__.py

      - name: Deploy to Cloud Run  
        working-directory: jobsearch_agents
        env:
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SERVICE_ACCOUNT_KEY_PATH: jobsearch_agents/serviceAccountKey.json
          GOOGLE_GENAI_USE_VERTEXAI: 'True'
          AGENT_PATH: ./jobsearch_agents
          SERVICE_NAME: gethired-agents
          APP_NAME: jobsearch_agents
        run: |
          echo "Current directory: $(pwd)"
          echo "AGENT_PATH: $AGENT_PATH"
          
          echo "y" | poetry run adk deploy cloud_run \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --service_name=$SERVICE_NAME \
            --app_name=$APP_NAME \
            --with_ui \
            $AGENT_PATH