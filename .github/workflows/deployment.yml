name: Deploy ADK Agents to Cloud Run

on:
  push:
    branches:
      - agent-interaction
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: jobsearch_agents
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Decode Firebase service account key
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > jobsearch_agents/jobsearch_agents/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Check available imports and fix sub-agents
        working-directory: jobsearch_agents
        run: |
          echo "Checking what's available in ADK modules..."
          poetry run python -c "
          print('=== Checking mcp_toolset ===')
          try:
              from google.adk.tools.mcp_tool import mcp_toolset
              for attr in dir(mcp_toolset):
                  if not attr.startswith('_'):
                      print(f'  - {attr}')
          except Exception as e:
              print(f'Error: {e}')
              
          print('\n=== Checking mcp_session_manager ===')
          try:
              from google.adk.tools.mcp_tool import mcp_session_manager
              for attr in dir(mcp_session_manager):
                  if not attr.startswith('_') and 'Param' in attr:
                      print(f'  - {attr}')
          except Exception as e:
              print(f'Error: {e}')
              
          print('\n=== Checking what is imported in mcp_toolset ===')
          try:
              import inspect
              from google.adk.tools.mcp_tool.mcp_toolset import MCPToolset
              # Get the module that MCPToolset is from
              module = inspect.getmodule(MCPToolset)
              # Check __all__ if it exists
              if hasattr(module, '__all__'):
                  print('Exported names:', module.__all__)
          except Exception as e:
              print(f'Error: {e}')
          "
          
          echo -e "\nCreating import fix file..."
          cat > fix_imports.py << 'EOF'
          import os
          import re
          
          # Read the main agent.py to see what import pattern is used
          with open('jobsearch_agents/agent.py', 'r') as f:
              main_agent_content = f.read()
          
          # Find the import pattern used in main agent
          if 'from google.adk.tools.mcp_tool.mcp_toolset import MCPToolset, StdioServerParameters' in main_agent_content:
              # StdioServerParameters is imported from mcp_toolset
              correct_import = 'from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPServerParams'
          else:
              # Try the session_manager import
              correct_import = 'from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPServerParams'
          
          # Fix all Python files in sub_agents
          for root, dirs, files in os.walk('jobsearch_agents/sub_agents'):
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                      
                      # Replace any import of StreamableHTTPServerParams
                      content = re.sub(
                          r'from google\.adk\.tools\.mcp_tool\.\w+ import .*StreamableHTTPServerParams.*',
                          correct_import,
                          content
                      )
                      
                      with open(filepath, 'w') as f:
                          f.write(content)
                      print(f'Fixed imports in {filepath}')
          EOF
          
          poetry run python fix_imports.py

      - name: Create .env file for agent
        working-directory: jobsearch_agents
        run: |
  
          cat > .env << EOF
          SERVICE_ACCOUNT_KEY_PATH=/app/agents/jobsearch_agents/jobsearch_agents/serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT || env.GOOGLE_CLOUD_PROJECT }}
          EOF
    
          # Also create a local .env for testing
          cat > jobsearch_agents/.env << EOF
          SERVICE_ACCOUNT_KEY_PATH=serviceAccountKey.json
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_GENAI_USE_VERTEXAI=True
          GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT || env.GOOGLE_CLOUD_PROJECT }}
          EOF
    
          echo "=== Created .env files ==="
          echo "--- Root .env ---"
          cat .env
          echo -e "\n--- Package .env ---"
          cat jobsearch_agents/.env

      - name: Fix __init__.py and ensure root_agent export
        working-directory: jobsearch_agents
        run: |
          # Create proper __init__.py
          cat > jobsearch_agents/__init__.py << 'EOF'
          """
          Job Search Automation Agent package.
          """
          from . import agent
          from .agent import root_agent
          
          __all__ = ['agent', 'root_agent']
          EOF
          
          # Ensure agent.py exports root_agent at the end
          echo "Checking if agent.py exports root_agent..."
          if ! grep -q "^root_agent" jobsearch_agents/agent.py; then
              echo "Adding root_agent export to agent.py..."
              echo -e "\n# Export root_agent for ADK\nroot_agent = agent" >> jobsearch_agents/agent.py
          fi
          
          # Create a simple test to verify structure
          cat > test_structure.py << 'EOF'
          import sys
          import os
          
          print("=== Current working directory ===")
          print(os.getcwd())
          
          print("\n=== Python path ===")
          for p in sys.path[:5]:
              print(f"  - {p}")
          
          print("\n=== Directory structure ===")
          for root, dirs, files in os.walk('.'):
              level = root.replace('.', '', 1).count(os.sep)
              indent = ' ' * 2 * level
              print(f'{indent}{os.path.basename(root)}/')
              subindent = ' ' * 2 * (level + 1)
              for file in files:
                  if file.endswith(('.py', '.toml', '.env')):
                      print(f'{subindent}{file}')
              if level > 2:  # Limit depth
                  dirs.clear()
          
          print("\n=== Testing import ===")
          sys.path.insert(0, '.')
          try:
              import jobsearch_agents
              print('✓ Successfully imported jobsearch_agents')
              print(f'  Module location: {jobsearch_agents.__file__}')
              print(f'  Has root_agent? {hasattr(jobsearch_agents, "root_agent")}')
              if hasattr(jobsearch_agents, 'root_agent'):
                  print(f'  root_agent type: {type(jobsearch_agents.root_agent)}')
              
              # Check if we can import agent directly
              from jobsearch_agents import agent
              print('✓ Successfully imported agent module')
              print(f'  Has root_agent? {hasattr(agent, "root_agent")}')
              
              # List all attributes in agent module
              print('\n  Agent module attributes:')
              for attr in dir(agent):
                  if not attr.startswith('_'):
                      print(f'    - {attr}')
                      
          except Exception as e:
              print(f'✗ Failed to import: {e}')
              import traceback
              traceback.print_exc()
          EOF
          
          echo "Running structure test..."
          poetry run python test_structure.py

      - name: Debug structure before deployment
        working-directory: jobsearch_agents
        run: |
          echo "=== Final directory structure ==="
          find . -type f $$ -name "*.py" -o -name "*.toml" -o -name ".env" $$ | grep -v __pycache__ | sort
          
          echo -e "\n=== Content of __init__.py files ==="
          find . -name "__init__.py" -type f | while read f; do
              echo -e "\n--- $f ---"
              cat "$f" | head -10
          done
          
          echo -e "\n=== Checking agent.py exports ==="
          echo "--- Last 20 lines of jobsearch_agents/agent.py ---"
          tail -20 jobsearch_agents/agent.py
          
          echo -e "\n=== Environment variables ==="
          cat .env

      - name: Deploy to Cloud Run  
        working-directory: jobsearch_agents
        env:
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SERVICE_ACCOUNT_KEY_PATH: jobsearch_agents/serviceAccountKey.json
          GOOGLE_GENAI_USE_VERTEXAI: 'True'
          AGENT_PATH: ./jobsearch_agents
          SERVICE_NAME: gethired-agents
          APP_NAME: jobsearch_agents
        run: |
          echo "Current directory: $(pwd)"
          echo "AGENT_PATH: $AGENT_PATH"
          
          echo "y" | poetry run adk deploy cloud_run \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --service_name=$SERVICE_NAME \
            --app_name=$APP_NAME \
            --with_ui \
            $AGENT_PATH