name: Deploy Agents to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Decode Firebase service account key
        working-directory: ${{ github.workspace }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > "${GITHUB_WORKSPACE}/$SA_PATH"
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          SA_PATH: ${{ secrets.SA_FILE_PATH }}

      - name: Insert env var after os.environ.copy()
        working-directory: jobsearch_agents
        run: |
          if grep -q "env = os.environ.copy()" job_coach/agent.py; then
            sed -i '/env = os.environ.copy()/a\
            env["SERVICE_ACCOUNT_KEY_PATH"] = env.get("FIREBASE_SERVICE_ACCOUNT_KEY", "")
            \    env["SERVICE_ACCOUNT_KEY_PATH"] = env.get("FIREBASE_SERVICE_ACCOUNT_KEY", "")
            ' job_coach/agent.py
            echo "Environment variable insertion completed"
          else
            echo "Target line not found in job_coach/agent.py"
            exit 1
          fi
      - name: Build and Push Docker Image
        id: build
        working-directory: ${{ github.workspace }}
        run: |
          # Build Docker image from project root to access template directory
          IMAGE_NAME="gcr.io/$GOOGLE_CLOUD_PROJECT/gethired-agents"
          IMAGE_TAG="${{ github.sha }}"
          
          docker build -f jobsearch_agents/Dockerfile -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest
          
          # Configure docker to use gcloud credentials
          gcloud auth configure-docker gcr.io -q
          
          # Push images to Google Container Registry
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:latest
          
          echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

  deploy-staging:
    if: github.event_name == 'pull_request'
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Staging)
        env:
          SERVICE_NAME: 'gethired-agents-staging'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          STAGING_BUCKET: 'gethired-staging'
        run: |
          gcloud run deploy $SERVICE_NAME \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=$GOOGLE_CLOUD_LOCATION \
            --image=${{ needs.build.outputs.image }} \
            --update-secrets=${{secrets.SA_PATH}}=firebase-service-account-key:latest \
            --port=8080 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2.0 \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=$GOOGLE_CLOUD_LOCATION,DISABLE_WEB_DRIVER=0,STAGING_BUCKET=$STAGING_BUCKET,GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }},FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
            --set-env-vars="FIREBASE_SERVICE_ACCOUNT_KEY=${{ secrets.SA_PATH }}"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Production)
        env:
          SERVICE_NAME: 'gethired-agents'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          FIREBASE_STORAGE_BUCKET: 'gethired-prod'
          STAGING_BUCKET: 'gethired-prod'
        run: |
          gcloud run deploy $SERVICE_NAME \
            --project=$GOOGLE_CLOUD_PROJECT \
            --region=$GOOGLE_CLOUD_LOCATION \
            --image=${{ needs.build.outputs.image }} \
            --update-secrets=${{secrets.SA_PATH}}=firebase-service-account-key:latest \
            --port=8080 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=5Gi \
            --cpu=4.0 \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=$GOOGLE_CLOUD_LOCATION,DISABLE_WEB_DRIVER=0,STAGING_BUCKET=$STAGING_BUCKET,GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }},FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
            --set-env-vars="FIREBASE_SERVICE_ACCOUNT_KEY=${{ secrets.SA_PATH }}"
