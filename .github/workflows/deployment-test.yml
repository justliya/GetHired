name: Test Deploy ADK Agents to Cloud Run

on:
  push:
    paths:
      - 'jobsearch_agents/**'
      - '.github/workflows/deployment-test.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobsearch_agents
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies (skip project installation)
        run: |
          # Create and activate poetry environment
          poetry env use python3.11
          source $(poetry env info --path)/bin/activate
          
          # Install dependencies for local development
          poetry install --no-interaction --no-ansi --no-root

          # Add the venv's bin to PATH so 'adk' is available
          VENV_BIN="$(poetry env info -p)/bin"
          echo "VENV_BIN=$VENV_BIN" >> $GITHUB_ENV
          echo "$VENV_BIN" >> $GITHUB_PATH

          # Verify installations in the correct environment
          poetry run python -c "import sys; print(f'Python path: {sys.path}')"
          poetry run python -c "import deprecated; print('✅ deprecated is installed')"
          poetry run python -c "from google.adk.cli import main; print('✅ adk is installed')"
          poetry run which adk

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          export_environment_variables: true
          cleanup_credentials: true

      - name: Decode Firebase service account key
        working-directory: ${{ github.workspace }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > "${GITHUB_WORKSPACE}/${{ secrets.SA_PATH }}"
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Deploy to Cloud Run
        working-directory: ./jobsearch_agents
        env:
          AGENT_PATH: 'jobsearch_agents'  # Directory containing agent.py and __init__.py
          SERVICE_NAME: 'gethired-agents-test'
          APP_NAME: 'jobsearch_agents'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          FIREBASE_STORAGE_BUCKET: '${{ vars.FIREBASE_STORAGE_BUCKET }}'
          SERVICE_ACCOUNT_KEY_PATH: '${{ secrets.SA_PATH }}'
        run: |
          # Activate poetry environment
          source $(poetry env info --path)/bin/activate
          
          # Verify the agent directory structure
          ls -la $AGENT_PATH
          
          # Use Poetry's venv to invoke 'adk'
          poetry run adk deploy cloud_run \
            --project=$GCP_PROJECT \
            --region=$GOOGLE_CLOUD_LOCATION \
            --service_name=$SERVICE_NAME \
            --app_name=$APP_NAME \
            --trace_to_cloud \
            --verbosity=error \
            $AGENT_PATH

      - name: Update Service
        env:
          SERVICE_NAME: 'gethired-agents-test'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          STAGING_BUCKET: 'gethired-staging'
        run: |
          gcloud run services update $SERVICE_NAME \
            --project=$GCP_PROJECT \
            --region=$GOOGLE_CLOUD_LOCATION \
            --update-env-vars="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT,GOOGLE_CLOUD_LOCATION=$GOOGLE_CLOUD_LOCATION,DISABLE_WEB_DRIVER=0,STAGING_BUCKET=$STAGING_BUCKET" \
            --update-env-vars="GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }},FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}"
