[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    agents: marks tests related to agent functionality
    resume: marks tests related to resume processing
    templates: marks tests related to template rendering

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg __pycache__

# Coverage settings (if using pytest-cov)
# addopts = --cov=resume --cov=job_listing --cov=company_research --cov-report=html --cov-report=term

# Timeout for tests (if using pytest-timeout)
timeout = 300

# Parallel execution (if using pytest-xdist)
# addopts = -n auto
